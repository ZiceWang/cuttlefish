[project]
name = "cuttlefish"
version = "0.1.0"
description = "Cuttlefish: signed-graph gated message-passing language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "datasets>=4.0.0",
    "tokenizers>=0.23.1",
    "torch>=2.11.0",
    "transformers>=5.17.0",
    "pyarrow>=18.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
